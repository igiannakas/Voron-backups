## Test load/unload on specified gates with optional temporary speed/accel overrides
[gcode_macro EMU_SPEED_TEST]
description: Test load/unload on specified gates with optional temporary speed/accel overrides. If a speed/accel combination causes the EMU to stall, you have to use the e-stop to terminate the iterations, else you will grind filament.
gcode:
  # Params:
  #   GATES      - comma-separated gates (default "0")
  #   ITERATIONS - cycles per gate (default 1)
  #   SPEED      - override for BOTH gear_from_spool_speed & gear_unload_speed
  #   ACCEL      - override for BOTH gear_from_spool_accel & gear_unload_accel
  {% set GATES = params.GATES|default("0")|string %}
  {% set ITERATIONS = params.ITERATIONS|default(1)|int %}
  {% set tools = GATES.split(",") %}

  # --- Snapshot current [mmu] values ---
  {% set _mmu = printer.configfile.settings.mmu %}
  {% set save_gfss = _mmu.gear_from_spool_speed|float %}
  {% set save_gfsa = _mmu.gear_from_spool_accel|float %}
  {% set save_gus  = _mmu.gear_unload_speed|float %}
  {% set save_gua  = _mmu.gear_unload_accel|float %}

  # --- Determine overrides (fallback to current if not supplied) ---
  {% set OV_SPEED = params.SPEED|default(save_gfss)|float %}
  {% set OV_ACCEL = params.ACCEL|default(save_gfsa)|float %}

  {% if (tools|length > 0) and (ITERATIONS > 0) %}
      M400
      RESPOND TYPE=echo MSG="EMU_SPEED_TEST: Starting. Gates={GATES}, Iterations={ITERATIONS}."
      RESPOND TYPE=echo MSG="EMU_SPEED_TEST: Applying overrides -> Speed={OV_SPEED}, Accel={OV_ACCEL}."
      M400

      # Apply temporary overrides
      mmu_test_config gear_from_spool_speed={OV_SPEED} gear_from_spool_accel={OV_ACCEL} gear_unload_speed={OV_SPEED} gear_unload_accel={OV_ACCEL} quiet=1

      # --- Main test loops ---
      {% for tool in tools %}
         {% set tool_trim = tool|trim %}
         {% for i in range(ITERATIONS) %}
            {% set i1 = i + 1 %}
            M400
            RESPOND TYPE=echo MSG="EMU_SPEED_TEST: Gate {tool_trim} • Iteration {i1}/{ITERATIONS} • Speed={OV_SPEED} • Accel={OV_ACCEL}."
            M400
            MMU_SELECT TOOL={tool_trim}
            _MMU_STEP_LOAD_BOWDEN
            _MMU_STEP_UNLOAD_BOWDEN
            mmu_check_gate
         {% endfor %}
         mmu_recover
         mmu_unload
         mmu_check_gate
      {% endfor %}

      # --- Restore original values ---
      M400
      RESPOND TYPE=echo MSG="EMU_SPEED_TEST: Restoring original MMU values -> Speed(from_spool)={save_gfss}, Accel(from_spool)={save_gfsa}, Speed(unload)={save_gus}, Accel(unload)={save_gua}."
      M400
      mmu_test_config gear_from_spool_speed={save_gfss} gear_from_spool_accel={save_gfsa} gear_unload_speed={save_gus} gear_unload_accel={save_gua} quiet=1

      M400
      RESPOND TYPE=echo MSG="EMU_SPEED_TEST: Done."
      M400
  {% else %}
      M400
      RESPOND TYPE=echo MSG="EMU_SPEED_TEST: Gate(s) not provided or iterations < 1."
      M400
  {% endif %}


###########################################################################
# Convenience macro that runs MMU_CALIBRATE_BOWDEN for every gate in turn,
# instead of having to select each gate and re-issue the command manually.
#
# Parameters (all optional):
#   BOWDEN_LENGTH=<float>   Approximate bowden length passed to every gate.
#                           Must be slightly MORE than the real bowden length.
#                           Defaults to the firmware's bowden_homing_max.
#   SAVE=0|1                Persist results to mmu_vars.cfg (default: 1).
#   START_GATE=<int>        First gate to calibrate (default: 0). Useful for
#                           resuming after a failure.
#   END_GATE=<int>          Last gate to calibrate inclusive
#                           (default: num_gates - 1).
#
# Notes:
# - MMU must be homed and unloaded before running.
# - Requires an extruder homing sensor (PSF/Compression/Extruder entry)
# - Only gates whose printer.mmu.gate_status is 1 (AVAILABLE) or 2
#   (AVAILABLE_FROM_BUFFER) are calibrated. Empty (0) and unknown (-1) gates
#   are skipped automatically.
# - For MMUs configured with variable_bowden_lengths=0 the bowden length is
#   shared across all gates, so only gate 0 is calibrated and the macro will
#   tell you so and exit.
###########################################################################
[gcode_macro MMU_CALIBRATE_BOWDENS]
description: Calibrate bowden length for every gate (loops MMU_CALIBRATE_BOWDEN)
gcode:
    {% set num_gates       = printer.mmu.num_gates|int %}
    {% set variable_bl     = printer.configfile.settings.mmu_machine.variable_bowden_lengths|default(1)|int %}
    {% set start_gate      = params.START_GATE|default(0)|int %}
    {% set end_gate        = params.END_GATE|default(num_gates - 1)|int %}
    {% set bowden_length   = params.BOWDEN_LENGTH|default('')|string %}
    {% set save            = params.SAVE|default(1)|int %}

    {% if not printer.mmu.enabled %}
        {action_raise_error("MMU is disabled. Run MMU ENABLE=1 first")}
    {% endif %}
    {% if not printer.mmu.is_homed %}
        {action_raise_error("MMU must be homed before bulk bowden calibration. Run MMU_HOME")}
    {% endif %}
    {% if printer.mmu.filament_pos != 0 %}
        {action_raise_error("Filament must be unloaded (filament_pos=0) before bulk bowden calibration")}
    {% endif %}
    {% if start_gate < 0 or start_gate >= num_gates %}
        {action_raise_error("START_GATE=%d out of range (0..%d)" % (start_gate, num_gates - 1))}
    {% endif %}
    {% if end_gate < start_gate or end_gate >= num_gates %}
        {action_raise_error("END_GATE=%d out of range (%d..%d)" % (end_gate, start_gate, num_gates - 1))}
    {% endif %}

    # When variable_bowden_lengths is disabled only gate 0 has any effect
    {% if variable_bl == 0 %}
        MMU_LOG MSG="variable_bowden_lengths=0 on this MMU - all gates share gate 0's value."
        MMU_LOG MSG="Running a single calibration on gate 0 only."
        {% set end_gate = 0 %}
        {% set start_gate = 0 %}
    {% endif %}

    # Build the argument string passed to MMU_CALIBRATE_BOWDEN.
    {% set ns = namespace(extra='') %}
    {% if bowden_length != '' %}
        {% set ns.extra = ns.extra + ' BOWDEN_LENGTH=' + bowden_length %}
    {% endif %}
    {% set ns.extra = ns.extra + ' SAVE=' + save|string %}

    MMU_LOG MSG="-----------------------------------------------"
    MMU_LOG MSG="Starting bulk bowden calibration on gates {start_gate}..{end_gate}"
    MMU_LOG MSG="-----------------------------------------------"

    {% for gate in range(start_gate, end_gate + 1) %}
        {% set gate_status = printer.mmu.gate_status[gate]|int %}
        # Only calibrate gates known to have filament available:
        #   1 = GATE_AVAILABLE, 2 = GATE_AVAILABLE_FROM_BUFFER
        # Skip everything else (0=empty, -1=unknown).
        {% if gate_status not in [1, 2] %}
            MMU_LOG MSG="--> Gate {gate}: SKIPPED (gate_status={gate_status}, not AVAILABLE)"
        {% else %}
            MMU_LOG MSG="-----------------------------------------------"
            MMU_LOG MSG="--> Gate {gate}: selecting and starting calibration"
            MMU_LOG MSG="-----------------------------------------------"

            MMU_SELECT GATE={gate}
            MMU_CALIBRATE_BOWDEN{ns.extra}
        {% endif %}
    {% endfor %}

    MMU_LOG MSG="-----------------------------------------------"
    MMU_LOG MSG="Bulk bowden calibration complete."
    MMU_LOG MSG="Use MMU_STATUS to inspect resulting bowden lengths."
    MMU_LOG MSG="-----------------------------------------------"
