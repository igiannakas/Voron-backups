chain_count   : 5
color_order   : GRBW

[neopixel _unit0_gate1_leds]
pin           : unit0_gate1:PD3
chain_count   : 5
color_order   : GRBW

[neopixel _unit0_gate2_leds]
pin           : unit0_gate2:PD3
chain_count   : 5
color_order   : GRBW

[neopixel _unit0_gate3_leds]
