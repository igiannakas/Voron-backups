#
# LED SUPPORT: Define mmu leds, both the "neopixel" config and [mmu_led] to define their purpose
#   chain_count: Count much be feasible e.g. N-leds per gate plus extra segments
#   color_order: Set based on your particular neopixel specification (can be comma separated list)
#
[neopixel _unit0_gate0_leds]
