# └────────────────────────────────────────────────────────────────┘
#
# Optional eject buttons
# Note on pin inversion:
#   Most eject buttons are wired as normally-closed switches and use a non-inverted pull-up pin, e.g. ^unit0_gate0:PB2.
#   However, if using normally-open momentary buttons such as the EMU LED Button Board, the pin must be inverted,
#   e.g. ^!unit0_gate0:PB2. Otherwise Klipper may see the button as already pressed after restart and eject!
#
[gcode_button unit0_eject0]
pin: ^!unit0_gate0:PB6
press_gcode:
    MMU_EJECT UNIT=unit0 LGATE=0

[gcode_button unit0_eject1]
pin: ^!unit0_gate1:PB6
press_gcode:
    MMU_EJECT UNIT=unit0 LGATE=1

[gcode_button unit0_eject2]
pin: ^!unit0_gate2:PB6
press_gcode:
    MMU_EJECT UNIT=unit0 LGATE=2

[gcode_button unit0_eject3]
pin: ^!unit0_gate3:PB6
press_gcode:
    MMU_EJECT UNIT=unit0 LGATE=3

[gcode_button unit0_eject4]
pin: ^!unit0_gate4:PB6
